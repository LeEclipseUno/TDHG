<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#091b2c" />
    <title>Verkeerde afslag</title>
    <link rel="icon" href="./favicon.ico" />
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f3f5f9; color: #f7f8fa; font-family: 'Barlow', system-ui, sans-serif; padding: 16px; }
      .board { background: #0d4a9c; border-radius: 8px; padding: 5px; box-shadow: 0 12px 32px rgba(0,0,0,.4); max-width: 420px; width: 100%; }
      .inner { border: 3px solid #fff; border-radius: 5px; padding: 22px 20px; text-align: center; }
      h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: .02em; }
      p { margin: 0 0 18px; color: rgba(255,255,255,.85); }
      a { display: inline-block; background: #fff; color: #0d4a9c; text-decoration: none; font-weight: 700; padding: 10px 18px; border-radius: 5px; }
      .num { display: inline-block; background: #c8102e; color: #fff; font-weight: 800; padding: 2px 12px; border-radius: 5px; box-shadow: inset 0 0 0 2px #c8102e, inset 0 0 0 3.5px #fff; font-size: 26px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div class="board"><div class="inner">
      <div class="num">A404</div>
      <h1>Verkeerde afslag</h1>
      <p>Deze weg bestaat niet. Keer om naar het beginscherm.<br /><span style="opacity:.7">Wrong exit. This page does not exist.</span></p>
      <a id="home" href="/">Naar de start</a>
    </div></div>
    <script>
      // On GitHub project pages the site lives under /<repo>/; keep that prefix.
      var first = location.pathname.split('/')[1]
      if (first && !first.includes('.')) document.getElementById('home').href = '/' + first + '/'
    </script>
  </body>
</html>
